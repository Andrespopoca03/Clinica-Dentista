<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoyalSmile - Citas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    /* Estilos comunes */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lato', sans-serif;
    }
    :root {
      --primary-blue: #0a2463;
      --secondary-blue: #3a7ca5;
      --white: #fcfcfc;
      --heading-font: 'Playfair Display', serif;
    }
    body {
      background: linear-gradient(45deg, #f8f9fa, #e9ecef);
      overflow-x: hidden;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--heading-font);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .navbar {
      background: rgba(10, 36, 99, 0.9);
      backdrop-filter: blur(10px);
      padding: 1rem 2rem;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      border-radius: 0 0 15px 15px;
      transition: all 0.3s ease;
    }
    .nav-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    .hamburger {
      color: var(--white);
      font-size: 1.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .hamburger:hover {
      opacity: 0.8;
    }
    .logo {
      color: var(--white);
      font-family: var(--heading-font);
      font-size: 1.8rem;
      font-weight: 500;
      text-decoration: none;
      margin-right: auto;
    }
    .sidebar {
      position: fixed;
      left: -300px;
      top: 0;
      height: 100vh;
      width: 280px;
      background: rgba(10, 36, 99, 0.95);
      backdrop-filter: blur(15px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2000;
      padding: 2rem;
      border-radius: 0 15px 15px 0;
    }
    .sidebar.active {
      left: 0;
    }
    .sidebar-links {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 3rem;
    }
    .sidebar-links a {
      color: var(--white);
      text-decoration: none;
      font-size: 1.1rem;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-family: 'Lato', sans-serif;
    }
    .sidebar-links a:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(10px);
    }
    .close-btn {
      color: var(--white);
      font-size: 2rem;
      cursor: pointer;
      position: absolute;
      right: 1.5rem;
      top: 1rem;
      transition: all 0.3s ease;
    }
    .close-btn:hover {
      transform: rotate(90deg);
    }
    .hero {
      height: 100vh;
      background: linear-gradient(rgba(10, 36, 99, 0.7), rgba(10, 36, 99, 0.7)),
                  url('D4.jpg') center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
    }
    .hero-content {
      background: rgba(255, 255, 255, 0.9);
      padding: 3rem;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      animation: fadeInUp 1s ease;
    }
    .hero h1 {
      color: var(--primary-blue);
      font-size: 3.5rem;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    .hero p {
      color: var(--secondary-blue);
      font-size: 1.2rem;
      margin-bottom: 2rem;
      letter-spacing: 0.3px;
    }
    .form-section {
      padding: 4rem 2rem;
      max-width: 600px;
      margin: auto;
      background: rgba(255,255,255,0.95);
      border-radius: 15px;
      margin-top: -50px;
      position: relative;
      z-index: 10;
      box-shadow: 0 0 20px rgba(10,36,99,0.1);
    }
    .form-section form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .form-section input,
    .form-section textarea {
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    .form-section button {
      padding: 1rem;
      background: var(--primary-blue);
      color: var(--white);
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 700;
    }
    .form-section button:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(10, 36, 99, 0.3);
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2.5rem;
      }
      .hero-content {
        padding: 2rem;
      }
      .form-section {
        padding: 3rem 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-content">
      <div class="hamburger"><i class="fas fa-bars"></i></div>
      <a href="index.html" class="logo">RoyalSmile</a>
    </div>
  </nav>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="close-btn">×</div>
    <div class="sidebar-links">
      <a href="quienes-somos.html">Quiénes Somos</a>
      <a href="que-ofrecemos.html">Qué Ofrecemos</a>
      <a href="donde-estamos.html">Dónde Estamos</a>
      <a href="citas.html">Citas</a>
    </div>
  </div>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Pedir Cita</h1>
      <p>Agenda tu consulta de manera rápida y sencilla</p>
    </div>
  </section>

  <!-- Formulario de Citas -->
  <section class="form-section">
    <form action="#" method="post">
      <input type="text" name="nombre" placeholder="Nombre Completo" required>
      <input type="email" name="email" placeholder="Correo Electrónico" required>
      <input type="tel" name="telefono" placeholder="Teléfono" required>
      <input type="date" name="fecha" required>
      <input type="time" name="hora" required>
      <textarea name="mensaje" rows="4" placeholder="Mensaje (opcional)"></textarea>
      <button type="submit">Agendar Cita</button>
    </form>
  </section>

  <script>
    // Funcionalidad del Sidebar
    document.querySelector('.hamburger').addEventListener('click', () => {
      document.querySelector('.sidebar').classList.add('active');
    });
    document.querySelector('.close-btn').addEventListener('click', () => {
      document.querySelector('.sidebar').classList.remove('active');
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.sidebar') && 
          !e.target.closest('.hamburger') &&
          document.querySelector('.sidebar').classList.contains('active')) {
        document.querySelector('.sidebar').classList.remove('active');
      }
    });
    document.querySelectorAll('.sidebar-links a').forEach(link => {
      link.addEventListener('click', () => {
        document.querySelector('.sidebar').classList.remove('active');
      });
    });
  </script>
</body>
</html>
